    type: mmap
  - features_dir: build/re8-training/mww-v5/features/negative_synth
    sampling_weight: 4.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: build/re8-training/mww-v5/features/ambient
