window_step_ms: 10
train_dir: build/re8-training/mww-v5/model
features:
  - features_dir: build/re8-training/mww-v5/features/positive_real
    sampling_weight: 3.0
    penalty_weight: 1.0
    truth: true
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: build/re8-training/mww-v5/features/positive_synth
    sampling_weight: 2.0
    penalty_weight: 1.0
    truth: true
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: build/re8-training/mww-v5/features/positive_command
    sampling_weight: 2.0
    penalty_weight: 1.0
    truth: true
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: build/re8-training/mww-v5/features/negative_real
    sampling_weight: 5.0
    penalty_weight: 1.0
    truth: false
